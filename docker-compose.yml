name: dungeons

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dungeons_fitness
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admg2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d dungeons_fitness"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: postgresql://admin:admg2@db:5432/dungeons_fitness
      JWT_SECRET: troque_por_um_segredo_forte_aqui_minimo_16_chars
      JWT_EXPIRES_IN: 7d
      PORT: 3333
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
